name: rasr
description: |
  RASR (Reinforced Amortized Symbolic Regression), a transformer-based
  symbolic regression method with candidate generation and constant
  refinement.

  This SRBench integration expects a local checkpoint directory mounted at
  /srbench_pretrained (via -pretrained_dir) and loads checkpoint/config files
  from there.
